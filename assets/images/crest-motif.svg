<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" fill="none">
  <!-- Subtle decorative geometric background pattern -->
  <g opacity="0.18">
    <circle cx="250" cy="250" r="230" stroke="#C5A15D" stroke-width="1"/>
    <circle cx="250" cy="250" r="190" stroke="#C5A15D" stroke-width="0.8" stroke-dasharray="4 6"/>
    <circle cx="250" cy="250" r="150" stroke="#C5A15D" stroke-width="1.2"/>
    <circle cx="250" cy="250" r="110" stroke="#C5A15D" stroke-width="0.8"/>
    <circle cx="250" cy="250" r="70" stroke="#C5A15D" stroke-width="1"/>
    
    <!-- Quadrant axis and diamond structures -->
    <line x1="20" y1="250" x2="480" y2="250" stroke="#C5A15D" stroke-width="0.75"/>
    <line x1="250" y1="20" x2="250" y2="480" stroke="#C5A15D" stroke-width="0.75"/>
    
    <polygon points="250,60 440,250 250,440 60,250" stroke="#C5A15D" stroke-width="1" fill="none"/>
    <polygon points="250,100 400,250 250,400 100,250" stroke="#C5A15D" stroke-width="0.8" stroke-dasharray="3 3" fill="none"/>
    <polygon points="250,140 360,250 250,360 140,250" stroke="#C5A15D" stroke-width="1" fill="none"/>

    <!-- 8-point star / mandala nodes -->
    <circle cx="250" cy="60" r="4" fill="#C5A15D"/>
    <circle cx="440" cy="250" r="4" fill="#C5A15D"/>
    <circle cx="250" cy="440" r="4" fill="#C5A15D"/>
    <circle cx="60" cy="250" r="4" fill="#C5A15D"/>
    
    <circle cx="115" cy="115" r="3" fill="#C5A15D"/>
    <circle cx="385" cy="115" r="3" fill="#C5A15D"/>
    <circle cx="385" cy="385" r="3" fill="#C5A15D"/>
    <circle cx="115" cy="385" r="3" fill="#C5A15D"/>
  </g>
</svg>
